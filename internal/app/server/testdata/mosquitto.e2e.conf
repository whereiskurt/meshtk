# Broker fixture for TestE2EDualCodec (proxy_v5_e2e_test.go).
#
# Mirrors the PRODUCTION auth shape -- no anonymous access, a password_file, a
# plain TCP listener -- so the credential swap the proxy performs is actually
# load bearing: mosquitto only ever knows the `public` identity, and a client
# credential that leaked through would be rejected by the broker itself.
#
# The __UPPERCASE__ tokens are substituted at run time into a copy in
# t.TempDir(). The listener port is allocated free per run (so parallel runs
# cannot collide) and the password file is generated per run with
# mosquitto_passwd -- neither can be baked in here, and no credential material
# is ever committed.
#
# DELIBERATELY ABSENT: max_topic_alias.
# mosquitto 2.0 advertises TopicAliasMaximum=10 in its CONNACK by default, and
# leaving that default in place is exactly what makes the alias-strip assertion
# meaningful. The proxy must suppress topic aliases in both directions with NO
# broker configuration change -- a `max_topic_alias 0` here would let a broken
# proxy pass the test.
listener __PORT__ __BIND__
allow_anonymous false
password_file __PASSWORD_FILE__
log_dest stdout
log_type all
persistence false
