Fleet:
  - Id: "rebar-regular"
    Description: "Cluster at rebar"
    BehaviourTag: ["sayhello", "nodeinfo", "position","gitter"]
    BehaviourSecs: 5
    Seed: "4971a6ef-0d32-4eb8-ba80-9e759e748345"
    ShortNameTmpl: "R{{.nodeId}}"
    LongNameTmpl: "{{.fleetId}}-{{.nodeId}}-{{.shortseed}}"
    NodesPerRampInterval: [10]
    RampUpSecs: 10
    RampSteadySecs: 7
    RampDownSecs: 15
    NodesPerSteadyInterval: [10]
    Distribution: "uniform"
    BroadcastGitterSec: 300
    LatLongAltGitter: 1000
    TextMessageGitterSec: 300
    NodeDbPath: "./nodes.rebar.json"
    Chatbot:
      - Type: "shellscript"
        Script: "./msgreply.sh"
        IntervalSec: 300
        ScriptParamTmpl: "--nodeId '{{.nodeId}}' --seed '{{.shortseed}}' --msg '{{.msg}}'"
    Movement:
      - Type: "start"
        Latitude: 361565688
        Longitude: -1151540940
        Altitude: 420
        Precision: 32

