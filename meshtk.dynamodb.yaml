NodeDbPath: "./nodes.default.json"
LogFolder: "logs/"

Mqtt:
  # BrokerUri: "ssl://mqtt.defcon.run:8883"
  BrokerUri: "tcp://localhost:1883"
  Username: "asdfasdf"
  Password: "31337"
  ClientId: "kphkphkph"

Meshtastic:
  Channels:
    - Slot: "primary"
      Name: "dc.run"
      EncryptKey: "Wjt8kzHci9lqdS4tBzSF2VbQd86u6U3nhHaBl7V5TGE="
      IsEncrypted: true
      IsPrimary: true
    - Slot: "secondary"
      Name: "defcon"
      EncryptKey: "AQ=="
      IsEncrypted: true
